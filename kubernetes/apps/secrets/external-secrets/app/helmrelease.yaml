---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-secrets
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    bitwarden-sdk-server:
      enabled: true
      # The sdk-server loads its TLS certificate (bitwarden-tls-certs) only at
      # startup. When cert-manager renews it, the controller trusts the new CA
      # while the server still presents the old certificate, and every
      # ExternalSecret fails with "tls: bad certificate". Reloader restarts it.
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
    grafanaDashboard:
      enabled: true
      annotations:
        grafana_folder: "System"
