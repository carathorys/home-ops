---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: authentik-db
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      # same keys as the cnpg generated <cluster>-app secret
      data:
        host: postgres-rw.dbms.svc.cluster.local
        port: "5432"
        dbname: authentik
        username: authentik
        password: "{{ .AUTHENTIK_DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: auth-cluster-secrets
