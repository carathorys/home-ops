---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  chartRef:
    kind: OCIRepository
    name: generic-device-plugin
  interval: 1h
  # Exposes host devices as schedulable resources, so pods request a device
  # (resources.limits) instead of running privileged with a hostPath mount.
  values:
    fullnameOverride: generic-device-plugin
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi
    image:
      # renovate: datasource=docker depName=squat/generic-device-plugin
      tag: 0.2.0
      pullPolicy: IfNotPresent
    devices:
      # Requested by pods as "devic.es/dri" (the plugin's default domain).
      # AMD iGPU render node (VAAPI transcoding, ROCm, Vulkan), shared by all
      # its pods. Each GPU node (avarath 780M, esutha 890M, hummianet) offers
      # 10 "GPU units"; pods request units by weight, so heavy users can't
      # pile up on one node:
      #   Ollama 6 | Immich ML 3 (x2) | Jellyfin, Emby, Plex 2 | Immich
      #   microservices 1 (x2)   -> 20 of 30 units in total
      # Next to Ollama (6) at most 4 units remain for everything else, e.g.
      # one Immich ML + one microservices, or two media servers.
      # Units only steer placement; they don't limit actual GPU use.
      # (Ollama and Immich ML are kept off hummianet by node affinity.)
      - name: dri
        groups:
          - count: 10
            paths:
              - path: /dev/dri/renderD128
      # AMD KFD (ROCm compute, e.g. Ollama), requested as "devic.es/kfd";
      # ROCm needs it together with devic.es/dri.
      - name: kfd
        groups:
          - count: 10
            paths:
              - path: /dev/kfd
