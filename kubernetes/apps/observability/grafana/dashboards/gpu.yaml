---
# GPU units, GPU pods per node and the scheduler's events: why a pod runs where
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana-deployment
  folderRef: k8s
  configMapRef:
    name: grafana-dashboard-gpu
    key: gpu.json
