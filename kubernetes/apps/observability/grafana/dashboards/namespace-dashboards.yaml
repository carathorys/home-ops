---
# One "ns: <namespace>" dashboard per namespace, all built from the shared
# namespace-overview.json; each sets its own uid, title, folder and namespace.
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: namespace-auth
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana-deployment
  folderRef: k8s
  uid: namespace-auth
  configMapRef:
    name: grafana-dashboard-namespace-overview
    key: namespace-overview.json
  patch:
    scripts:
      - '.title = "ns: auth"'
      # "namespace" is a constant variable, whose value Grafana always takes
      # from .query, so set that (not just the current selection)
      - '.templating.list |= map(if .name == "namespace" then .query = "auth" | .current = {"text": "auth", "value": "auth"} | .options = [] else . end)'
---
