---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - folders.yaml
  - cluster-overview.yaml
  - namespace-dashboards.yaml
  - app-dashboards.yaml
  - observability-dashboards.yaml
configMapGenerator:
  - name: grafana-dashboard-cluster-overview
    files:
      - cluster-overview.json
  - name: grafana-dashboard-namespace-overview
    files:
      - namespace-overview.json
  - name: grafana-dashboard-app-tankstat
    files:
      - app-tankstat.json
  - name: grafana-dashboard-telemetry-pipeline
    files:
      - telemetry-pipeline.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # dashboard JSON uses ${datasource}/$namespace template syntax
    kustomize.toolkit.fluxcd.io/substitute: disabled
