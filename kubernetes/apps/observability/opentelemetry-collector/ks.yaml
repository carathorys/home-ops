---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opentelemetry-collector
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/observability/opentelemetry-collector/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # No postBuild substitution: the collector config uses ${env:...} syntax.
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
