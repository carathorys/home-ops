---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-agent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Agent (one per node): tails every container's stdout/stderr from
  # /var/log/pods, adds Kubernetes metadata and sends it to Loki over OTLP.
  values:
    mode: daemonset
    fullnameOverride: otel-agent
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    presets:
      logsCollection:
        enabled: true
        storeCheckpoints: true # remember file offsets across restarts (hostPath /var/lib/otelcol)
      kubernetesAttributes:
        enabled: true # node-local pod metadata, incl. workload and service.name
    # /var/log/pods is only readable by root on the node
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    ports:
      otlp: { enabled: false }
      otlp-http: { enabled: false }
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      metrics: { enabled: true }
    podMonitor:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      receivers:
        otlp: null
        jaeger: null
        zipkin: null
        prometheus: null
      processors:
        # Loki labels streams by service.name; fall back to the container
        # name for pods the k8s attributes processor couldn't name.
        transform/service-name:
          log_statements:
            - context: resource
              statements:
                - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
        # Level formats Loki's own detection doesn't recognise (stored as
        # "unknown"); map them to a proper severity, which Loki uses.
        # Serilog's short level tags ("[18:53:44] [INF] ...", e.g. Jellyfin):
        transform/severity:
          log_statements:
            - context: log
              statements:
                - set(severity_text, "trace") where IsMatch(body, "^\\[[0-9:]{8}\\] \\[VRB\\]")
                - set(severity_number, SEVERITY_NUMBER_TRACE) where IsMatch(body, "^\\[[0-9:]{8}\\] \\[VRB\\]")
                - set(severity_text, "debug") where IsMatch(body, "^\\[[0-9:]{8}\\] \\[DBG\\]")
                - set(severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(body, "^\\[[0-9:]{8}\\] \\[DBG\\]")
                - set(severity_text, "info") where IsMatch(body, "^\\[[0-9:]{8}\\] \\[INF\\]")
                - set(severity_number, SEVERITY_NUMBER_INFO) where IsMatch(body, "^\\[[0-9:]{8}\\] \\[INF\\]")
                - set(severity_text, "warn") where IsMatch(body, "^\\[[0-9:]{8}\\] \\[WRN\\]")
                - set(severity_number, SEVERITY_NUMBER_WARN) where IsMatch(body, "^\\[[0-9:]{8}\\] \\[WRN\\]")
                - set(severity_text, "error") where IsMatch(body, "^\\[[0-9:]{8}\\] \\[ERR\\]")
                - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(body, "^\\[[0-9:]{8}\\] \\[ERR\\]")
                - set(severity_text, "fatal") where IsMatch(body, "^\\[[0-9:]{8}\\] \\[FTL\\]")
                - set(severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(body, "^\\[[0-9:]{8}\\] \\[FTL\\]")
                # Plex Media Server / Scanner logs (followed by the plex pod's
                # *-log containers): "Nov 20, 2026 05:07:56.480 [thread] LEVEL - "
                - set(severity_text, "trace") where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] VERBOSE - ")
                - set(severity_number, SEVERITY_NUMBER_TRACE) where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] VERBOSE - ")
                - set(severity_text, "debug") where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] DEBUG - ")
                - set(severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] DEBUG - ")
                - set(severity_text, "info") where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] INFO - ")
                - set(severity_number, SEVERITY_NUMBER_INFO) where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] INFO - ")
                - set(severity_text, "warn") where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] WARN - ")
                - set(severity_number, SEVERITY_NUMBER_WARN) where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] WARN - ")
                - set(severity_text, "error") where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] ERROR - ")
                - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(body, "^[A-Z][a-z]{2} [0-9]{1,2}, [0-9]{4} [0-9:.]+ \\[[0-9]+\\] ERROR - ")
      exporters:
        debug: null
        otlphttp/loki:
          endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      service:
        pipelines:
          logs:
            receivers: []
            processors: [memory_limiter, transform/service-name, transform/severity, batch]
            exporters: [otlphttp/loki]
          metrics: null
          traces: null
