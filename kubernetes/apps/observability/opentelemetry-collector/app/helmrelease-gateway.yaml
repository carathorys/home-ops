---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Gateway: the one OTLP endpoint for apps
  #   otel-collector.observability.svc.cluster.local:4317 (gRPC) / :4318 (HTTP)
  # It adds the sender's Kubernetes metadata and routes each signal:
  # metrics -> Prometheus (OTLP receiver), logs -> Loki (OTLP), traces -> Tempo.
  values:
    mode: deployment
    fullnameOverride: otel-collector
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    presets:
      kubernetesAttributes:
        enabled: true # identifies the sending pod by its connection IP
    ports:
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      metrics: { enabled: true }
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null # own metrics are scraped through the ServiceMonitor
      exporters:
        debug: null
        otlphttp/prometheus:
          metrics_endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp/v1/metrics
        otlphttp/loki:
          endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        otlp/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/prometheus]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/loki]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp/tempo]
