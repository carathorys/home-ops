---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Gateway: the one OTLP endpoint for apps
  #   otel-collector.observability.svc.cluster.local:4317 (gRPC) / :4318 (HTTP)
  # It adds the sender's Kubernetes metadata and routes each signal:
  # metrics -> Prometheus (OTLP receiver), logs -> Loki (OTLP), traces -> Tempo.
  values:
    mode: deployment
    fullnameOverride: otel-collector
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    presets:
      kubernetesAttributes:
        enabled: true # identifies the sending pod by its connection IP
    # Read access to Kubernetes events for the k8s_events receiver below
    # (wired by hand instead of the chart preset, to get its own pipeline)
    clusterRole:
      rules:
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["get", "list", "watch"]
    ports:
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      metrics: { enabled: true }
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null # own metrics are scraped through the ServiceMonitor
        # Kubernetes events of all namespaces (scheduling decisions such as
        # "Successfully assigned x to avarath" or "Insufficient devic.es/dri",
        # pulls, probe failures, OOM kills), kept in Loki beyond the API's ~1h
        k8s_events: {}
      processors:
        transform/events:
          log_statements:
            - context: resource
              statements:
                - set(attributes["service.name"], "k8s-events")
            # The receiver maps Normal/Warning to severity numbers, but keeps
            # "Normal"/"Warning" as text, which Loki doesn't read as a level
            - context: log
              statements:
                - set(severity_text, "info") where severity_number == SEVERITY_NUMBER_INFO
                - set(severity_text, "warn") where severity_number == SEVERITY_NUMBER_WARN
                - set(severity_text, "error") where severity_number == SEVERITY_NUMBER_ERROR
                - set(severity_text, "fatal") where severity_number == SEVERITY_NUMBER_FATAL
      exporters:
        debug: null
        otlphttp/prometheus:
          metrics_endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp/v1/metrics
        otlphttp/loki:
          endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        otlp/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/prometheus]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlphttp/loki]
          logs/events:
            receivers: [k8s_events]
            processors: [memory_limiter, transform/events, batch]
            exporters: [otlphttp/loki]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp/tempo]
