---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tempo
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Single-binary Tempo storing traces on its own volume. Traces arrive from
  # the otel-collector gateway over OTLP; Grafana queries it on port 3200.
  values:
    tempo:
      reportingEnabled: false
      retention: 168h # 7 days
      # The backend worker polls the scheduler for compaction/retention jobs and
      # logs every empty answer as level=error ("error calling scheduler ... no
      # jobs found"), backing off to at most max_period (default 1m). With
      # little data there is rarely a job, so poll less often: same work, up
      # to 10 minutes later, ~6 instead of ~60 noise lines per hour.
      backendWorker:
        backoff:
          min_period: 30s
          max_period: 10m
      # receivers: the chart default (OTLP gRPC 4317 / HTTP 4318, plus Jaeger)
      # is kept as is; the chart's Service template requires the Jaeger keys.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    persistence:
      enabled: true
      storageClassName: iscsi
      size: 20Gi
    serviceMonitor:
      enabled: true
