---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-alerting
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: gatus-alerting
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Home Assistant webhook trigger of the "Gatus alerts" automation
        HA_GATUS_WEBHOOK_URL: "http://home-assistant.home-assistant.svc.cluster.local:8123/api/webhook/{{ .haGatusWebhook }}"
  dataFrom:
    - extract:
        key: alerting
