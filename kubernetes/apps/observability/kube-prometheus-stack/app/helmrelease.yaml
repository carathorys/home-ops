---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kube-prometheus-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    nameOverride: *app
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true

    alertmanager:
      enabled: true
      # Alerts go to Home Assistant (webhook automation -> phone push); the
      # always-firing Watchdog pings healthchecks.io as a dead man's switch.
      # Both URLs come from the alertmanager-secrets ExternalSecret (Bitwarden).
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: home-assistant
          group_by: ["alertname", "namespace"]
          group_wait: 1m
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: healthchecks
              matchers: ['alertname = "Watchdog"']
              group_wait: 0s
              group_interval: 5m
              repeat_interval: 5m
            - receiver: "null"
              matchers: ['alertname = "InfoInhibitor"']
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: ["namespace", "alertname"]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: ["namespace"]
        receivers:
          - name: "null"
          - name: home-assistant
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-secrets/ha-webhook-url
                send_resolved: true
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-secrets/healthchecks-url
                send_resolved: false
      alertmanagerSpec:
        secrets: ["alertmanager-secrets"]
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: iscsi
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    grafana:
      enabled: false

    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: apiserver_(response|watch_events)_sizes_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: apiserver_request_body_size_bytes_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: workqueue_(work|queue)_duration_seconds_bucket

    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels: ["__name__"]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

    kubeControllerManager:
      # Talos binds the controller-manager to localhost: scraping it only
      # produced permanent TargetDown/InstanceUnreachable alerts
      enabled: false
      endpoints: &cp
        - 10.11.0.16
        - 10.11.0.17
        - 10.11.0.18
      serviceMonitor: &sm
        metricRelabelings:
          - action: drop
            sourceLabels: ["__name__"]
            regex: workqueue_(work|queue)_duration_seconds_bucket

    kubeEtcd:
      enabled: false
      endpoints: *cp

    kubeScheduler:
      enabled: false
      endpoints: *cp
      serviceMonitor: *sm

    kubeProxy:
      enabled: false # KubeProxy is disabled in the cluster, see Cilium/Talos configs

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      # The filesystem mount-point/fs-type excludes come from the subchart's
      # defaultArgs (chart >= 94.x); don't repeat them here — node-exporter
      # refuses duplicated flags and crashloops.
      extraArgs:
        # AMD GPU utilisation and VRAM/GTT memory (node_drm_*), read from
        # /sys/class/drm; GPU temperature/power/clock already come via hwmon
        - --collector.drm
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - __meta_kubernetes_pod_node_name
              targetLabel: kubernetes_node
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - __meta_kubernetes_pod_node_name
              targetLabel: nodename
            - action: replace
              regex: (.*)
              replacement: $1.${SECRET_DOMAIN}:9100
              sourceLabels:
                - kubernetes_node
              targetLabel: instance

    kubeStateMetrics:
      enabled: true

    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      prometheus:
        monitor:
          enabled: true
          honorLabels: true

    prometheusOperator:
      fullnameOverride: prometheus-operator

    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["prometheus.${SECRET_DOMAIN}"]
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
      prometheusSpec:
        # no alertingEndpoints: the chart points Prometheus at its own Alertmanager
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        # Receive app metrics pushed over OTLP by the otel-collector gateway
        # (POST /api/v1/otlp/v1/metrics). job/instance come from
        # service.name/service.instance.id; promote these too as labels.
        enableOTLPReceiver: true
        otlp:
          promoteResourceAttributes:
            - service.version
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.node.name
        tsdb:
          outOfOrderTimeWindow: 30m # pushed samples can arrive late/out of order
        enableFeatures:
          - memory-snapshot-on-shutdown
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 6Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: iscsi
              resources:
                requests:
                  storage: 50Gi

  postRenderers:
    - kustomize:
        patches:
          - target:
              group: monitoring.coreos.com
              version: v1
              kind: ServiceMonitor
              name: kube-prometheus-stack-kubelet
            patch: |
              - op: add
                path: /spec/endpoints/0/trackTimestampsStaleness
                value: false
              - op: add
                path: /spec/endpoints/1/trackTimestampsStaleness
                value: false
              - op: add
                path: /spec/endpoints/2/trackTimestampsStaleness
                value: false
