---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Home Assistant webhook trigger of the "Kubernetes alerts" automation
        ha-webhook-url: "http://home-assistant.home-assistant.svc.cluster.local:8123/api/webhook/{{ .haAlertmanagerWebhook }}"
        # healthchecks.io check (dead man's switch for the Watchdog alert)
        healthchecks-url: "{{ .healthchecksPingUrl }}"
  dataFrom:
    - extract:
        key: alerting
