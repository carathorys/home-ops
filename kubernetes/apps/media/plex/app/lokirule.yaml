---
groups:
  - name: plex
    rules:
      - alert: PlexDatabaseBusy
        expr: |
          sum by (service_name) (count_over_time({service_name="plex"} |~ "(?i)retry busy DB"[2m])) > 0
        for: 2m
        labels:
          severity: critical
          category: logs
        annotations:
          app: "{{ $labels.service_name }}"
          summary: "{{ $labels.service_name }} is experiencing database issues"
