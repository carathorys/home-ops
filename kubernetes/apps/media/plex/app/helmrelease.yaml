# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: ${REPLICAS}
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
            # kubernetes.io/egress-bandwidth: "250000k"
            # kubernetes.io/ingress-bandwidth: "250000k"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/linuxserver/plex
              repository: ghcr.io/linuxserver/plex
              tag: 1.43.5.11079-b3b13e506-ls333@sha256:9a1325bf0b34a50993a04be0bdcc7fab841d2a78161bd11b4db4ff8478a7ac2a
              pullPolicy: Always
            env:
              TZ: "Europe/Budapest"
              ADVERTISE_IP: "https://${APP}:443,https://${APP}.${SECRET_DOMAIN}:443"
              ALLOWED_NETWORKS: "192.168.0.0/24,10.0.0.0/8"
              PUID: ${APP_UID}
              PGID: ${APP_GID}
            resources:
              requests:
                cpu: 1m
                memory: 2Gi
              limits:
                # cpu: 10m
                memory: 10Gi
                # AMD iGPU render node for hardware transcoding: 2 of a node's
                # 10 GPU units (see generic-device-plugin)
                devic.es/dri: 2
          # Plex writes its logs only to files (logs emptyDir). These follow
          # them on stdout so the otel-agent ships them to Loki, one source
          # (k8s_container_name) per log; tail -F follows the files by name
          # across Plex's rotations (.log -> .1.log).
          server-log:
            image: &logImage # renovate: datasource=docker depName=busybox
              repository: busybox
              tag: 1.38.0
            command: ["tail", "-n", "0", "-F", "/logs/Plex Media Server.log"]
            securityContext: &logSecurityContext
              runAsUser: ${APP_UID}
              runAsGroup: ${APP_GID}
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources: &logResources
              requests:
                cpu: 1m
                memory: 8Mi
              limits:
                memory: 32Mi
          # Per-transcode session reports (XML): hardware vs software, speed
          transcoder-log:
            image: *logImage
            command: ["tail", "-n", "0", "-F", "/logs/Plex Transcoder Statistics.log"]
            securityContext: *logSecurityContext
            resources: *logResources
          # Matcher, Analysis and Chapter Thumbnails scanner logs as one
          # source; each line is suffixed with its scanner, e.g. " [Matcher]"
          scanner-log:
            image: *logImage
            command: ["/bin/sh", "/scripts/follow-scanner-logs.sh"]
            securityContext: *logSecurityContext
            resources: *logResources
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.2.2
        ports:
          http:
            port: &port 32400
            protocol: TCP
    route:
      internal:
        hostnames: ["${APP}", "${APP}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: plex
        advancedMounts:
          main:
            main:
              - path: /config
      movies:
        type: persistentVolumeClaim
        existingClaim: movies
        advancedMounts:
          main:
            main:
              - path: /movies
                readOnly: true
      tv:
        type: persistentVolumeClaim
        existingClaim: tv
        advancedMounts:
          main:
            main:
              - path: /tv
                readOnly: true
      kids-movies:
        type: persistentVolumeClaim
        existingClaim: kids-movies
        advancedMounts:
          main:
            main:
              - path: /mnt/Gyerek/Filmek
                readOnly: true
      kids-tv:
        type: persistentVolumeClaim
        existingClaim: kids-tv
        advancedMounts:
          main:
            main:
              - path: /mnt/Gyerek/Sorozatok
                readOnly: true
      music-video:
        type: persistentVolumeClaim
        existingClaim: music-video
        advancedMounts:
          main:
            main:
              - path: /music/video
                readOnly: true
      music-sound:
        type: persistentVolumeClaim
        existingClaim: music-sound
        advancedMounts:
          main:
            main:
              - path: /music/sound
                readOnly: true
      family-pomaz:
        type: persistentVolumeClaim
        existingClaim: family-pomaz
        advancedMounts:
          main:
            main:
              - path: /media/disk_a/Family/Videos/Pomaz
                readOnly: true
      logs:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /config/Library/Application Support/Plex Media Server/Logs
            server-log: &logMount
              - path: /logs
                readOnly: true
            transcoder-log: *logMount
            scanner-log: *logMount
      # follow-scanner-logs.sh
      scripts:
        type: configMap
        name: plex-scripts
        advancedMounts:
          main:
            scanner-log:
              - path: /scripts
                readOnly: true
      plex-cache:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /config/Library/Application Support/Plex Media Server/Cache
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp
