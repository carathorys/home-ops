---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: qbittorrent-vpn
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # NordVPN access token (Nord Account -> NordVPN -> Set up NordVPN
        # manually). The fetch-wireguard-key init container exchanges it for
        # the NordLynx private key at every pod start; mind its expiry date.
        NORDVPN_ACCESS_TOKEN: "{{ .accessToken }}"
  dataFrom:
    - extract:
        key: qbittorrent-vpn
