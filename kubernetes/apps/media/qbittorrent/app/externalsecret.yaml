---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: qbittorrent-vpn
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # NordLynx (WireGuard) private key, NOT the NordVPN access token
        WIREGUARD_PRIVATE_KEY: "{{ .wireguardPrivateKey }}"
  dataFrom:
    - extract:
        key: qbittorrent-vpn
