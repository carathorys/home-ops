# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: ${REPLICAS}
        # gluetun's IP rules are pod-wide: never run old and new pod together
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Never cluster DNS, so tracker lookups can't leak outside the VPN.
          # 127.0.0.1 is gluetun's own DNS server (DNS over TLS in the tunnel).
          # 1.1.1.1 serves the fetch-wireguard-key init container, which runs
          # before gluetun; once gluetun is up its firewall only lets 1.1.1.1
          # out through the tunnel. qBittorrent needs no cluster names; don't
          # add containers here that do.
          dnsPolicy: None
          dnsConfig:
            nameservers: ["127.0.0.1", "1.1.1.1"]
            options:
              - name: ndots
                value: "1"
        initContainers:
          # Runs first (init containers start in name order): exchanges the
          # NordVPN access token for the NordLynx private key and writes it to
          # the in-memory vpn-secrets volume as wg0.conf for gluetun.
          fetch-wireguard-key:
            image:
              # renovate: datasource=docker depName=docker.io/library/alpine
              repository: docker.io/library/alpine
              tag: 3.24.4
            command: ["/bin/sh", "/scripts/fetch-wireguard-key.sh"]
            env:
              NORDVPN_ACCESS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-vpn
                    key: NORDVPN_ACCESS_TOKEN
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          # Native sidecar (restartPolicy: Always): starts after the key is
          # fetched, and the
          # qBittorrent container only starts once the tunnel is up (startup
          # probe). It shares the pod network namespace, so all of
          # qBittorrent's internet traffic leaves through NordVPN (WireGuard);
          # gluetun's firewall drops anything else (kill switch).
          gluetun:
            image:
              # renovate: datasource=docker depName=ghcr.io/qdm12/gluetun
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            restartPolicy: Always
            env:
              TZ: "Europe/Budapest"
              VPN_SERVICE_PROVIDER: nordvpn
              VPN_TYPE: wireguard
              # Talos' kernel has WireGuard built in, so no /dev/net/tun needed
              WIREGUARD_IMPLEMENTATION: kernelspace
              # qBittorrent is bound to this interface (Options -> Advanced)
              VPN_INTERFACE: tun0
              SERVER_COUNTRIES: Hungary
              # WebUI (qui, envoy-internal, LoadBalancer, kubelet probes)
              FIREWALL_INPUT_PORTS: "8080"
              # Pods, Services and LAN stay on eth0. Required for replies to
              # inbound WebUI connections too, else they go into the tunnel.
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
              VERSION_INFORMATION: "off"
              # The private key comes from /run/secrets/wg0.conf (vpn-secrets),
              # written by the fetch-wireguard-key init container.
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            lifecycle:
              # Remove routing rules a previous, abruptly stopped gluetun left
              # behind (gluetun wiki, Kubernetes: "adding IPv6 rule: file exists")
              postStart:
                exec:
                  command:
                    [
                      "/bin/sh",
                      "-c",
                      "(ip rule del table 51820; ip -6 rule del table 51820) || true",
                    ]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/linuxserver/qbittorrent
              repository: ghcr.io/linuxserver/qbittorrent
              tag: 5.1.4-r3-ls453
            env:
              TZ: "Europe/Budapest"
              PUID: ${APP_UID}
              PGID: ${APP_GID}
              WEBUI_PORT: &webPort 8080
              # Listening port for peers. NordVPN has no port forwarding, so
              # this is never reachable from outside: qBittorrent runs passive
              # (non-connectable) and only makes outgoing peer connections.
              TORRENTING_PORT: 54149
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.2.1
        ports:
          http:
            port: *webPort
            protocol: TCP
    route:
      internal:
        hostnames: ["${APP}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{}]
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: qbittorrent
        advancedMounts:
          main:
            main:
              - path: /config
                readOnly: false
      downloads:
        type: persistentVolumeClaim
        existingClaim: downloads
        advancedMounts:
          main:
            main:
              - path: /downloads
                readOnly: false
      scripts:
        type: configMap
        name: qbittorrent-scripts
        advancedMounts:
          main:
            fetch-wireguard-key:
              - path: /scripts
                readOnly: true
      # NordLynx private key (wg0.conf), in memory only, never on disk
      vpn-secrets:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          main:
            fetch-wireguard-key:
              - path: /run/secrets
            gluetun:
              - path: /run/secrets
                readOnly: true
