# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: ${REPLICAS}
        # gluetun's IP rules are pod-wide: never run old and new pod together
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Name resolution only through gluetun's own DNS server (DNS over TLS
          # inside the tunnel), so tracker lookups can't leak via cluster DNS.
          # qBittorrent needs no cluster names; don't add containers that do.
          dnsPolicy: None
          dnsConfig:
            nameservers: ["127.0.0.1"]
            options:
              - name: ndots
                value: "1"
        initContainers:
          # Native sidecar (restartPolicy: Always): starts first, and the
          # qBittorrent container only starts once the tunnel is up (startup
          # probe). It shares the pod network namespace, so all of
          # qBittorrent's internet traffic leaves through ProtonVPN
          # (WireGuard); gluetun's firewall drops anything else (kill switch).
          gluetun:
            image:
              # renovate: datasource=docker depName=ghcr.io/qdm12/gluetun
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            restartPolicy: Always
            env:
              TZ: "Europe/Budapest"
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              # Talos' kernel has WireGuard built in, so no /dev/net/tun needed
              WIREGUARD_IMPLEMENTATION: kernelspace
              VPN_INTERFACE: tun0
              SERVER_COUNTRIES: Hungary
              # Only P2P servers, which are the ones that can forward a port
              # (needs a paid Proton plan; free servers allow no P2P)
              PORT_FORWARD_ONLY: "on"
              # Active mode: gluetun requests an inbound port from Proton
              # (NAT-PMP), opens it in its firewall on tun0, and keeps it alive.
              # Proton picks the port and may change it on reconnect, so the
              # commands below (re)configure qBittorrent through its WebUI API.
              VPN_PORT_FORWARDING: "on"
              # {{PORT}} and {{VPN_INTERFACE}} are gluetun's placeholders; they
              # are escaped because app-template renders values as Go templates.
              VPN_PORT_FORWARDING_UP_COMMAND: '/bin/sh /scripts/qbittorrent-port.sh up {{ "{{PORT}}" }} {{ "{{VPN_INTERFACE}}" }}'
              VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh /scripts/qbittorrent-port.sh down
              # WebUI (qui, envoy-internal, LoadBalancer, kubelet probes)
              FIREWALL_INPUT_PORTS: "8080"
              # Pods, Services and LAN stay on eth0. Required for replies to
              # inbound WebUI connections too, else they go into the tunnel.
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
              VERSION_INFORMATION: "off"
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-vpn
                    key: WIREGUARD_PRIVATE_KEY
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            lifecycle:
              # Remove routing rules a previous, abruptly stopped gluetun left
              # behind (gluetun wiki, Kubernetes: "adding IPv6 rule: file exists")
              postStart:
                exec:
                  command:
                    [
                      "/bin/sh",
                      "-c",
                      "(ip rule del table 51820; ip -6 rule del table 51820) || true",
                    ]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/linuxserver/qbittorrent
              repository: ghcr.io/linuxserver/qbittorrent
              tag: 5.1.4-r3-ls453
            env:
              TZ: "Europe/Budapest"
              PUID: ${APP_UID}
              PGID: ${APP_GID}
              WEBUI_PORT: &webPort 8080
              # No TORRENTING_PORT: the listening port is the one Proton
              # forwards, set by gluetun's port forwarding command
              # (scripts/qbittorrent-port.sh) together with the interface.
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 2Gi
          # qBittorrent writes its log (torrents, trackers, peers, errors) only
          # to a file on the config volume; follow it on stdout so the
          # otel-agent ships it to Loki like every other container's output.
          # tail -F follows the file by name across qBittorrent's rotations.
          logs:
            image:
              # renovate: datasource=docker depName=busybox
              repository: busybox
              tag: 1.38.0
            command: ["tail", "-n", "0", "-F", "/logs/qbittorrent.log"]
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 1m
                memory: 8Mi
              limits:
                memory: 32Mi
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.2.1
        ports:
          http:
            port: *webPort
            protocol: TCP
    route:
      internal:
        hostnames: ["${APP}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{}]
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: qbittorrent
        advancedMounts:
          main:
            main:
              - path: /config
                readOnly: false
            logs:
              - path: /logs
                subPath: qBittorrent/logs
                readOnly: true
      downloads:
        type: persistentVolumeClaim
        existingClaim: downloads
        advancedMounts:
          main:
            main:
              - path: /downloads
                readOnly: false
      # gluetun's port forwarding up/down command
      scripts:
        type: configMap
        name: qbittorrent-scripts
        advancedMounts:
          main:
            gluetun:
              - path: /scripts
                readOnly: true
