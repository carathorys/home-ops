# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: ${REPLICAS}
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            runAsNonRoot: true
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/autobrr/qui
              repository:  ghcr.io/autobrr/qui
              tag: v1.30.0
            env:
              TZ: "Europe/Budapest"
              PUID: ${APP_UID}
              PGID: ${APP_GID}
              QUI__OIDC_ENABLED: "true"
              QUI__OIDC_ISSUER: "${QUI_OIDC_ISSUER}"
              QUI__OIDC_CLIENT_ID: "${QUI_OIDC_CLIENT_ID}"
              QUI__OIDC_CLIENT_SECRET: "${QUI_OIDC_CLIENT_SECRET}"
              QUI__OIDC_REDIRECT_URL: "https://qui.${SECRET_DOMAIN}/api/auth/oidc/callback"
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
    service:
      main:
        type: LoadBalancer
        ports:
          http:
            port: 7476
            protocol: TCP
    route:
      internal:
        hostnames: ["qui.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs: [{}]
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: qui
        advancedMounts:
          main:
            main:
              - path: /config
                readOnly: false
