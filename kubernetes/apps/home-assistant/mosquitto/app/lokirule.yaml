---
groups:
  - name: mosquitto
    rules:
      - alert: EmbyDatabaseBusy
        expr: |
          sum by (service_name) (count_over_time({service_name="mosquitto"} |~ "(?i)retry busy DB"[2m])) > 0
        for: 2m
        labels:
          severity: critical
          category: logs
        annotations:
          app: "{{ $labels.service_name }}"
          summary: "{{ $labels.service_name }} is experiencing database issues"
