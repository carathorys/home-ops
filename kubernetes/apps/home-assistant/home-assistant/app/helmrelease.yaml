---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        # keep the original resource name now that there is a second controller
        forceRename: home-assistant
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            runAsUser: "${APP_UID}"
            runAsGroup: "${APP_GID}"
            runAsNonRoot: true
            fsGroup: "${APP_GID}"
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/home-operations/home-assistant
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.1
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
      code-server:
        replicas: 1
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: "${APP_UID}"
            runAsGroup: "${APP_GID}"
            runAsNonRoot: true
            fsGroup: "${APP_GID}"
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/coder/code-server
              repository: ghcr.io/coder/code-server
              tag: 4.145.2
            # bypass the image entrypoint (fixuid expects uid 1000); run as APP_UID like home-assistant
            command: ["/usr/bin/dumb-init", "/usr/bin/code-server"]
            args:
              - --auth
              - none
              - --bind-addr
              - 0.0.0.0:12321
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - /config
            env:
              TZ: Europe/Budapest
              HOME: /tmp/code-server
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      main:
        forceRename: home-assistant
        controller: main
        type: LoadBalancer
        loadBalancerIP: 192.168.2.4
        ports:
          http:
            port: 8123
            protocol: TCP
      code-server:
        controller: code-server
        ports:
          http:
            port: 12321
            protocol: TCP
    serviceMonitor:
      main:
        serviceName: home-assistant
        enabled: true
        endpoints:
          - port: http
            scheme: http
            path: /api/prometheus
            bearerTokenSecret:
              name: home-assistant-secret
              key: HASS_BEARER_TOKEN
    route:
      internal-app:
        forceRename: home-assistant
        hostnames: ["home-assistant.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: 8123
      code-server:
        # internal network only: attached to envoy-internal, not envoy-external
        hostnames: ["hass-code.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: code-server
                port: 12321

    persistence:
      config:
        enabled: true
        existingClaim: home-assistant
        advancedMounts:
          main:
            main:
              - path: /config
          code-server:
            main:
              - path: /config
      tmpfs:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp
                subPath: hass-tmp
          code-server:
            main:
              - path: /tmp
                subPath: code-server-tmp
