---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: forgejo-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Read by Forgejo's environment-to-ini on every start
        FORGEJO__database__PASSWD: "{{ .dbPassword }}"
        FORGEJO__security__SECRET_KEY: "{{ .secretKey }}"
  dataFrom:
    - extract:
        key: forgejo-secrets
