---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            kubernetes.io/hostname: avarath
        containers:
          main:
            securityContext:
              privileged: true
            image:
              # renovate: datasource=docker depName=ollama/ollama
              repository: ollama/ollama
              tag: rocm
              pullPolicy: Always
            command:
              - /bin/bash
              - -c
              - |
                set -eu
                ollama serve &
                pid=$!
                trap 'kill "$pid"; wait "$pid" || true; exit 0' TERM INT
                until ollama list >/dev/null 2>&1; do
                  if ! kill -0 "$pid" 2>/dev/null; then
                    wait "$pid"
                    exit $?
                  fi
                  sleep 1
                done
                ollama pull "$OLLAMA_MODEL"
                ollama run "$OLLAMA_MODEL" "" </dev/null
                wait "$pid"
            env:
              TZ: Europe/Budapest
              HSA_OVERRIDE_GFX_VERSION: "11.0.0"
              OLLAMA_KEEP_ALIVE: "-1"
              OLLAMA_CONTEXT_LENGTH: "8192"
              OLLAMA_MODEL: gemma4:e2b
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - ollama ps | grep -q "$OLLAMA_MODEL"
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 11434
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - ollama ps | grep -q "$OLLAMA_MODEL"
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    persistence:
      kfd:
        type: hostPath
        hostPath: /dev/kfd
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/kfd
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        globalMounts:
          - path: /dev/dri
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /dev/shm
      data:
        type: emptyDir
        globalMounts:
          - path: /root/.ollama
