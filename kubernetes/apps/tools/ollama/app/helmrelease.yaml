---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            nodeAffinity:
              # Never hummianet: only the 780M (avarath) and 890M (esutha)
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["avarath", "esutha"]
              # TEST: prefer esutha's 890M (gfx1150); revert to avarath if
              # Ollama can't use that GPU
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["esutha"]
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ollama/ollama
              repository: ollama/ollama
              tag: rocm
              pullPolicy: Always
            command:
              - /bin/bash
              - -c
              - |
                set -eu
                ollama serve &
                pid=$!
                trap 'kill "$pid"; wait "$pid" || true; exit 0' TERM INT
                until ollama list >/dev/null 2>&1; do
                  if ! kill -0 "$pid" 2>/dev/null; then
                    wait "$pid"
                    exit $?
                  fi
                  sleep 1
                done
                ollama pull "$OLLAMA_MODEL"
                ollama run "$OLLAMA_MODEL" "" </dev/null
                wait "$pid"
            env:
              TZ: Europe/Budapest
              HSA_OVERRIDE_GFX_VERSION: "11.0.0"
              OLLAMA_KEEP_ALIVE: "-1"
              OLLAMA_CONTEXT_LENGTH: "8192"
              OLLAMA_MODEL: gemma4:e2b
              OLLAMA_IGPU_ENABLE: "1"
              # GGML_VULKAN: "1"
              # OLLAMA_VULKAN: "1"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - ollama ps | grep -q "$OLLAMA_MODEL"
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 11434
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - ollama ps | grep -q "$OLLAMA_MODEL"
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                # Radeon 780M for ROCm, from generic-device-plugin (shared):
                # the render node (/dev/dri/renderD128) plus KFD (/dev/kfd)
                devic.es/dri: 1
                devic.es/kfd: 1
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    persistence:
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /dev/shm
      data:
        type: emptyDir
        globalMounts:
          - path: /root/.ollama
