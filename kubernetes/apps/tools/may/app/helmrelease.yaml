---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/dannymcc/may
              repository: ghcr.io/dannymcc/may
              tag: "0.44.2"
            env:
              TZ: Europe/Budapest
              DATABASE_URL: sqlite:////app/data/may.db
              UPLOAD_FOLDER: /app/data/uploads
              PUID: ${APP_UID}
              PGID: ${APP_GID}
    service:
      main:
        ports:
          http:
            port: &port 5050
    route:
      internal:
        hostnames: ["garage.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: may
        advancedMounts:
          main:
            main:
              - path: /app/data
                readOnly: false
