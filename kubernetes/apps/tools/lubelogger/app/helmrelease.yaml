---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/hargata/lubelogger
              repository: ghcr.io/hargata/lubelogger
              tag: v1.7.3
            env:
              TZ: Europe/Budapest
    service:
      main:
        ports:
          http:
            port: &port 8080
    route:
      internal:
        hostnames: ["lubelogger.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: lubelogger
        advancedMounts:
          main:
            main:
              - path: /App/data
                subPath: data
                readOnly: false
              - path: /root/.aspnet/DataProtection-Keys
                subPath: keys
                readOnly: false
