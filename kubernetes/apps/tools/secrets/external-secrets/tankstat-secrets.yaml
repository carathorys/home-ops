---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tankstat-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: tankstat-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        # Prefer flattened extract key; fall back to slice / JSON string / plain email.
        Auth__AdminEmails__0: '{{ if index . "adminEmails.0" }}{{ index . "adminEmails.0" }}{{ else if kindIs "slice" .adminEmails }}{{ index .adminEmails 0 }}{{ else if and (kindIs "string" .adminEmails) (hasPrefix .adminEmails "[") }}{{ index (fromJson .adminEmails) 0 }}{{ else }}{{ .adminEmails }}{{ end }}'
  dataFrom:
    - extract:
        key: tankstat-secrets
