---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tankstat-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: tankstat-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        readerApiKey: "{{ .readerApiKey }}"
        Auth__AdminEmails__0: '{{ regexFind "[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}" (.adminEmails | toString) }}'
  dataFrom:
    - extract:
        key: tankstat-secrets
