---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tankstat-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: tankstat-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        Auth__AdminEmails__0: '{{ with fromJson (.adminEmails | default "[]") }}{{ if gt (len .) 0 }}{{ index . 0 }}{{ end }}{{ end }}'
        Auth__AdminEmails__1: '{{ with fromJson (.adminEmails | default "[]") }}{{ if gt (len .) 1 }}{{ index . 1 }}{{ end }}{{ end }}'
        Auth__AdminEmails__2: '{{ with fromJson (.adminEmails | default "[]") }}{{ if gt (len .) 2 }}{{ index . 2 }}{{ end }}{{ end }}'
  dataFrom:
    - extract:
        key: tankstat-secrets
