---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: gitea-runner-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Same value Gitea gets as GITEA_RUNNER_REGISTRATION_TOKEN (gitea-secrets)
        token: "{{ .runnerToken }}"
  dataFrom:
    - extract:
        key: gitea-secrets
