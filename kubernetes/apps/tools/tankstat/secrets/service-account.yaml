---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.35.1-standalone-strict/role.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tankstat-secrets-reader
  namespace: tools
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.35.1-standalone-strict/rolebinding.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tankstat-secrets-reader
  namespace: tools
subjects:
  - kind: ServiceAccount
    name: tankstat-secrets-reader
roleRef:
  kind: Role
  name: tankstat-secrets-reader
  apiGroup: rbac.authorization.k8s.io

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.35.1-standalone-strict/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tankstat-secrets-reader
automountServiceAccountToken: true
