---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tankstat-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: tankstat-db
    template:
      engineVersion: v2
      data:
        Database__ConnectionString: "Host=postgres-rw.dbms.svc.cluster.local;Port=5432;Database=tankstat;Username=tankstat;Password={{ .dbPassword }};SSL Mode=Require"
  dataFrom:
    - extract:
        key: tankstat-secrets
