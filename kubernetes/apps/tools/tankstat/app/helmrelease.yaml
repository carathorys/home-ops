---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1654
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/carathorys/tankstat
              repository: ghcr.io/carathorys/tankstat
              tag: "0.1.0"
            env:
              ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
              TZ: Europe/Budapest
              Database__Provider: PostgreSql
              Auth__Mode: Oidc
              Auth__Oidc__Authority: https://auth.${SECRET_DOMAIN}/application/o/tankstat/
              Auth__PublicUrl: https://cars.${SECRET_DOMAIN}
              Storage__Path: /data/uploads
              Auth__Oidc__Scopes__0: "openid"
              Auth__Oidc__ClientId:
                valueFrom:
                  secretKeyRef:
                    name: tankstat-secrets
                    key: clientId
              Auth__Oidc__ClientSecret:
                valueFrom:
                  secretKeyRef:
                    name: tankstat-secrets
                    key: clientSecret
              Auth__AdminEmails__0:
                valueFrom:
                  secretKeyRef:
                    name: tankstat-secrets
                    key: Auth__AdminEmails__0
              Database__ConnectionString:
                valueFrom:
                  secretKeyRef:
                    name: tankstat-env
                    key: Database__ConnectionString
    service:
      main:
        ports:
          http:
            port: &port 8080
    route:
      internal:
        hostnames: ["cars.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: tankstat
        advancedMounts:
          main:
            main:
              - path: /data
                readOnly: false
