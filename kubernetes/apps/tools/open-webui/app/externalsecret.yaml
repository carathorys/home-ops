---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: open-webui-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Authentik OIDC client (provider/application slug: open-webui)
        OAUTH_CLIENT_ID: "{{ .oidcClientId }}"
        OAUTH_CLIENT_SECRET: "{{ .oidcClientSecret }}"
  dataFrom:
    - extract:
        key: open-webui-secrets
