---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
              repository: ghcr.io/open-webui/open-webui
              tag: v0.13.4
            env:
              TZ: Europe/Budapest
              OLLAMA_BASE_URL: http://ollama:11434
              DEFAULT_MODELS: gemma4:e2b
              # --- Login via Authentik (OIDC) only ---
              WEBUI_AUTH: "True"
              WEBUI_URL: https://${APP}.${SECRET_DOMAIN}
              # keep the session signing key on the PVC; the image default
              # (/app/backend/.webui_secret_key) is lost on every restart
              WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
              # oauth.* settings are read from env on every start
              # (ENABLE_OAUTH_PERSISTENT_CONFIG defaults to false)
              OAUTH_PROVIDER_NAME: Authentik
              OPENID_PROVIDER_URL: https://auth.${SECRET_DOMAIN}/application/o/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://${APP}.${SECRET_DOMAIN}/oauth/oidc/callback
              OAUTH_SCOPES: openid email profile
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              # Role from Authentik groups on every login: members of
              # "authentik Admins" become admin, everyone else a normal user
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ROLES_CLAIM: groups
              OAUTH_ALLOWED_ROLES: "*"
              OAUTH_ADMIN_ROLES: authentik Admins
              # No local passwords: hides the form and rejects password
              # sign-in server-side (incl. the no-auth admin@localhost user)
              ENABLE_LOGIN_FORM: "false"
              ENABLE_PASSWORD_AUTH: "false"
            envFrom:
              - secretRef:
                  name: open-webui-secrets
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    route:
      internal:
        hostnames: ["${APP}", "${APP}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: open-webui
        globalMounts:
          - path: /app/backend/data
