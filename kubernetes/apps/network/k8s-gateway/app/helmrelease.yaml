---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.0.99"
      externalTrafficPolicy: Cluster
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: log
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute Service
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
      # Internal-only hostnames: on the LAN these resolve ONLY to envoy-internal,
      # even if they also have an envoy-external route (e.g. Authentik outpost).
      # CoreDNS picks the most specific zone, so these win over `.` above.
      # To add an app, append one `- zone:` line.
      - zones:
          - zone: hass-code.${SECRET_DOMAIN}
          - zone: it-tools.${SECRET_DOMAIN}
          - zone: home-assistant.${SECRET_DOMAIN}
          - zone: sonarr.${SECRET_DOMAIN}
          - zone: radarr.${SECRET_DOMAIN}
          - zone: jackett.${SECRET_DOMAIN}
          - zone: qbittorrent.${SECRET_DOMAIN}
        port: 53
        plugins:
          - name: errors
          - name: log
          - name: template
            parameters: IN A
            # envoy-internal's pinned IP (network/envoy-gateway/app/envoy.yaml)
            configBlock: |-
              answer "{{ .Name }} 1 IN A 192.168.1.100"
          - name: template
            parameters: ANY ANY
            # AAAA/HTTPS/etc.: empty NOERROR, so clients fall back to the A record
            configBlock: |-
              rcode NOERROR
