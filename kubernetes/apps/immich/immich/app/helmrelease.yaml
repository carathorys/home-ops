# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &appName immich
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      server:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          secret.reloader.stakater.com/reload: &secret composed-secret
        pod:
          # affinity:
          #   nodeAffinity:
          #     requiredDuringSchedulingIgnoredDuringExecution:
          #       nodeSelectorTerms:
          #         - matchExpressions:
          #             - key: feature.node.kubernetes.io/amd-gpu
          #               operator: NotIn
          #               values:
          #                 - "true"
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: *appName
                  app.kubernetes.io/controller: server
        containers:
          server:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
            envFrom:
              - secretRef:
                  name: *secret
            env:
              IMMICH_CONFIG_FILE: /config/immich-config.yaml
              IMMICH_WORKERS_INCLUDE: api
              DB_HOSTNAME: postgres-rw.dbms.svc.cluster.local
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secrets
                    key: IMMICH_DB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
              limits:
                memory: 5000Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &serverPort 2283
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
      microservices:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: *secret
        replicas: 2
        pod:
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 44
              - 105
              - 109
              - 10000
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: *appName
                  app.kubernetes.io/controller: microservices
        containers:
          microservices:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
            envFrom:
              - secretRef:
                  name: *secret
            env:
              IMMICH_CONFIG_FILE: /config/immich-config.yaml
              IMMICH_WORKERS_EXCLUDE: api
              NVIDIA_VISIBLE_DEVICES: "all"
              NVIDIA_DRIVER_CAPABILITIES: "all"
              DB_HOSTNAME: postgres-rw.dbms.svc.cluster.local
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secrets
                    key: IMMICH_DB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
              limits:
                # AMD iGPU render node for video transcoding: 1 of a node's
                # 10 GPU units (see generic-device-plugin)
                devic.es/dri: 1
      machine-learning:
        strategy: RollingUpdate
        replicas: 2
        pod:
          enableServiceLinks: false
          affinity:
            # Only avarath and esutha, never hummianet (kept for the media
            # servers); the spread below prefers one replica on each
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["avarath", "esutha"]
          securityContext:
            runAsUser: ${APP_UID}
            runAsGroup: ${APP_GID}
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              # Preference only: with just two allowed nodes, a replica whose
              # node has no free GPU units (e.g. Ollama plus media servers)
              # runs on the other node instead of staying Pending
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: *appName
                  app.kubernetes.io/controller: machine-learning
        containers:
          machine-learning:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
              repository: ghcr.io/immich-app/immich-machine-learning
              # ROCm variant (AMD iGPU); needs ~35 GiB of node disk
              tag: v3.4.2-rocm
            env:
              # 780M (gfx1103) and 890M (gfx1150) run as gfx1100, as for
              # Ollama
              HSA_OVERRIDE_GFX_VERSION: "11.0.0"
              HSA_USE_SVM: "0"
              GPU_MAX_HW_QUEUES: "1"
              MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-B-16-SigLIP__webli
              MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ViT-B-16-SigLIP__webli
              MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION: buffalo_l
              MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION: buffalo_l
              MPLCONFIGDIR: /cache/matplotlib
            resources:
              requests:
                cpu: 100m
                memory: 250Mi
              limits:
                # ROCm: the render node, 3 of a node's 10 GPU units (see
                # generic-device-plugin), plus KFD (/dev/kfd)
                devic.es/dri: 3
                devic.es/kfd: 1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &mlPort 3003
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              # With ROCm, MIGraphX compiles each preloaded model for the GPU
              # at start (~25 s per model, /ping unresponsive meanwhile); give
              # it up to 15 minutes before liveness can restart the container
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *mlPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
          metrics:
            port: 8081
      microservices:
        controller: microservices
        ports:
          metrics:
            port: 8081
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: *mlPort

    route:
      app:
        hostnames: ["${APP}", "${APP}.${SECRET_DOMAIN}", "photos.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: server
                port: *serverPort
    persistence:
      config:
        type: secret
        name: *secret
        advancedMounts:
          server:
            server:
              - path: /config/immich-config.yaml
                subPath: IMMICH_CONFIG
          microservices:
            microservices:
              - path: /config/immich-config.yaml
                subPath: IMMICH_CONFIG
      library:
        type: persistentVolumeClaim
        existingClaim: family-photos
        advancedMounts:
          server:
            server:
              - path: /data
          microservices:
            microservices:
              - path: /data

      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            server:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding-dump
              - path: /usr/src/app/.transformers_cache
                subPath: transformers-cache
          microservices:
            microservices:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding-dump
              - path: /usr/src/app/node_modules/local-reverse-geocoder/geonames_dump
                subPath: geonames
              - path: /usr/src/app/.transformers_cache
                subPath: transformers-cache
          machine-learning:
            machine-learning:
              - path: /config/matplotlib
      model-cache:
        type: persistentVolumeClaim
        existingClaim: mlcache
        advancedMounts:
          machine-learning:
            machine-learning:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
