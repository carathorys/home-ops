---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: composed-secret
spec:
  refreshInterval: 1m
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: composed-secret
    template:
      engineVersion: v2
  data:
    - secretKey: OIDC_CLIENT_ID
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-secrets
        property: CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-secrets
        property: CLIENT_SECRET
    - secretKey: OIDC_ISSUER_URL
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-secrets
        property: ISSUER_URL
    - secretKey: REDIS_PASSWORD
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: dragonfly-access
        property: password
    - secretKey: REDIS_HOSTNAME
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-configuration
        property: REDIS_HOSTNAME
    - secretKey: REDIS_PORT
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-configuration
        property: REDIS_PORT
    - secretKey: REDIS_DBINDEX
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-configuration
        property: REDIS_DBINDEX
    - secretKey: IMMICH_CONFIG
      sourceRef:
        storeRef:
          name: immich-k8s-local-store
          kind: SecretStore
      remoteRef:
        key: immich-configuration
        property: immich-config.yaml
