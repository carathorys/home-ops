---
# yaml-language-server: $schema=https://schemas.gallay.io/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-manager
  target:
    name: postgres-secrets
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        POSTGRES_SUPER_PASS: "{{ .cnpg_POSTGRES_SUPER_PASS }}"
        # media
        RADARR_USERNAME: "{{ .media_RADARR_USERNAME }}"
        RADARR_PASSWORD: "{{ .media_RADARR_PASSWORD }}"
        RADARR_DATABASE: "{{ .media_RADARR_DATABASE }}"
        SONARR_USERNAME: "{{ .media_SONARR_USERNAME }}"
        SONARR_PASSWORD: "{{ .media_SONARR_PASSWORD }}"
        SONARR_DATABASE: "{{ .media_SONARR_DATABASE }}"
        JELLYSEERR_USERNAME: "{{ .media_JELLYSEERR_USERNAME }}"
        JELLYSEERR_PASSWORD: "{{ .media_JELLYSEERR_PASSWORD }}"
        JELLYSEERR_DATABASE: "{{ .media_JELLYSEERR_DATABASE }}"
        # auth
        AUTHENTIK_DB_PASSWORD: "{{ .auth_AUTHENTIK_DB_PASSWORD }}"
        # immich
        IMMICH_DB_PASSWORD: "{{ .immich_IMMICH_DB_PASSWORD }}"
        # tools
        TANKSTAT_DB_PASSWORD: "{{ .tankstat_dbPassword }}"
  dataFrom:
    - extract:
        key: cloudnative-pg-superuser
      rewrite:
        - regexp:
            source: "(.*)"
            target: "cnpg_$1"
    - extract:
        key: media-cluster-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "media_$1"
    - extract:
        key: auth-cluster-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "auth_$1"
    - extract:
        key: immich-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "immich_$1"
    - extract:
        key: tankstat-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "tankstat_$1"
