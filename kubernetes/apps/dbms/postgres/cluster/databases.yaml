---
# yaml-language-server: $schema=https://schemas.gallay.io/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
spec:
  cluster:
    name: postgres
  name: immich
  owner: immich
  ensure: present
  allowConnections: true
  # immich runs without superuser, so the operator pre-creates every extension it needs
  extensions:
    - name: cube
    - name: earthdistance
    - name: vector
    - name: vchord
    - name: pg_trgm
    - name: unaccent
    - name: uuid-ossp
---
# yaml-language-server: $schema=https://schemas.gallay.io/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tankstat
spec:
  cluster:
    name: postgres
  name: tankstat
  owner: tankstat
  ensure: present
  allowConnections: true
