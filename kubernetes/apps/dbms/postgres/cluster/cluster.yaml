---
# yaml-language-server: $schema=https://schemas.gallay.io/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  # vectorchord image is required for immich; it is a superset of the standard cnpg image
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
  instances: 3
  primaryUpdateStrategy: supervised
  storage:
    size: 64Gi
    storageClass: iscsi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      kubernetes.io/arch: amd64
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser
  backup:
    target: primary
    volumeSnapshot:
      labels:
        app.kubernetes.io/name: postgres-db-backup
      online: true
      onlineConfiguration:
        waitForArchive: true
        immediateCheckpoint: true
      className: iscsi
      walClassName: iscsi
      # deleting a Backup also deletes its snapshot (pruned by backup-pruner.yaml)
      snapshotOwnerReference: backup
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 1GB
      effective_cache_size: 1500MB
      work_mem: 8MB
      maintenance_work_mem: 256MB
      autovacuum_work_mem: 128MB
      autovacuum_max_workers: "3"
      autovacuum_naptime: 30s
      autovacuum_vacuum_cost_limit: "800"
      autovacuum_vacuum_scale_factor: "0.1"
      checkpoint_timeout: 15min
      max_wal_size: 4GB
      min_wal_size: 1GB
      wal_compression: zstd
      random_page_cost: "1.3"
      default_statistics_target: "200"
      effective_io_concurrency: "200"
      max_parallel_workers: "4"
      max_parallel_workers_per_gather: "4"
      max_parallel_maintenance_workers: "4"
      hot_standby_feedback: "on"
      huge_pages: "off"
      wal_sender_timeout: 60s
      wal_receiver_timeout: 60s
      wal_keep_size: "32GB"
      max_slot_wal_keep_size: "32GB"
    shared_preload_libraries:
      - vchord.so
  replicationSlots:
    highAvailability:
      enabled: true
  managed:
    roles:
      # media
      - connectionLimit: -1
        ensure: present
        name: "${RADARR_USERNAME}"
        comment: Radarr app user
        inherit: false
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: radarr-user
      - connectionLimit: -1
        ensure: present
        name: "${SONARR_USERNAME}"
        comment: Sonarr app user
        inherit: false
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: sonarr-user
      - connectionLimit: -1
        ensure: present
        name: "${JELLYSEERR_USERNAME}"
        comment: Jellyseerr app user
        inherit: false
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: jellyseerr-user
      # auth
      - connectionLimit: -1
        ensure: present
        name: authentik
        comment: Authentik app user
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: authentik-user
      # immich
      - connectionLimit: -1
        ensure: present
        name: immich
        comment: Immich app user
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: immich-user
      # tools
      - connectionLimit: -1
        ensure: present
        name: tankstat
        comment: Tankstat app user
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: tankstat-user
  monitoring:
    enablePodMonitor: true
