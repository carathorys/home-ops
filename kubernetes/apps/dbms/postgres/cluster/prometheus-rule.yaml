---
# yaml-language-server: $schema=https://schemas.gallay.io/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be -1 when it has not failed.
          expr: |-
            delta(cnpg_pg_stat_archiver_last_failed_time[5m]) > 0
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
    - name: postgres-backup.rules
      rules:
        - alert: PostgresBackupTooOld
          annotations:
            description: The last successful backup of {{ $labels.job }} is {{ $value | humanizeDuration }} old; the daily ScheduledBackup did not complete.
            summary: No successful Postgres backup in the last 26 hours.
          expr: |-
            time() - max by (job) (cnpg_collector_last_available_backup_timestamp{job="dbms/postgres"}) > 26 * 3600
          for: 10m
          labels:
            severity: critical
        - alert: PostgresBackupFailed
          annotations:
            description: The most recent backup attempt of {{ $labels.job }} failed after the last successful one.
            summary: A Postgres backup failed.
          expr: |-
            max by (job) (cnpg_collector_last_failed_backup_timestamp{job="dbms/postgres"})
              > max by (job) (cnpg_collector_last_available_backup_timestamp{job="dbms/postgres"})
          for: 5m
          labels:
            severity: critical
        - alert: PostgresBackupMetricsMissing
          annotations:
            description: No backup metrics are scraped for dbms/postgres, so backup age cannot be checked.
            summary: Postgres backup metrics are missing.
          expr: |-
            absent(cnpg_collector_last_available_backup_timestamp{job="dbms/postgres"})
          for: 1h
          labels:
            severity: warning
